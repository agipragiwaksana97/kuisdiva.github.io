<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>💖 Kuisioner Pasangan Lucu 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      background-color: #fff0f5;
      padding: 20px;
      max-width: 800px;
      margin: auto;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 192, 203, 0.5);
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #ff69b4;
      font-size: 2.5em;
      animation: fadeIn 2s ease-out;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
      color: #d63384;
      font-size: 1.1em;
      opacity: 0;
      animation: fadeInUp 1s ease-out forwards;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      background-color: #fff;
      font-family: 'Comic Neue', cursive;
      margin-top: 8px;
      opacity: 0;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    input[type="submit"] {
      display: block;
      margin: 30px auto;
      background-color: #ff69b4;
      color: white;
      padding: 12px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      opacity: 0;
      animation: fadeInUp 1.5s ease-out forwards;
    }

    input[type="submit"]:hover {
      background-color: #ff1493;
    }

    .emoji {
      font-size: 1.2em;
    }

    /* Animasi */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Background Musik */
    audio {
      position: fixed;
      bottom: 10px;
      left: 10px;
      display: none;
    }

    /* Gambar Ilustrasi */
    .illustration {
      display: block;
      margin: 20px auto;
      width: 200px;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <!-- Musik Latar -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <h1>🌟 Kuisioner Lucu untuk Kamu 🌟</h1>

</html>
